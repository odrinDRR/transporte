<div class="d-flex align-items-center justify-content-center min-vh-100" style="background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-header) 100%);">
  <div class="card bg-custom-card border-custom shadow-lg" style="width: 100%; max-width: 450px; border-radius: 16px;">
    
    <div class="card-body p-5 text-center">
      <div class="bg-white p-2 rounded-circle d-inline-block mb-3 shadow">
        <img src="/assets/images/logo.jpg" width="60" alt="Logo" class="rounded-circle" style="object-fit: cover; height: 60px;">
      </div>
      
      <h4 class="text-white fw-bold mb-1">SMU Logística</h4>
      <p class="text-custom-muted small mb-4">Sistema Maestro Unificado de Transporte</p>

      <!-- PASO 1: SELECCIÓN DE ROL -->
      <div class="text-start mb-4" *ngIf="!rolSeleccionado">
        <h6 class="text-white border-bottom border-custom pb-2 mb-3">
          <i class="bi bi-person-badge"></i> Seleccione un Perfil
        </h6>
        <div class="d-grid gap-2">
          <button class="btn btn-outline-primary text-start" (click)="seleccionarRol('ADMIN')">
            <strong>Administrador</strong><br><small class="text-white-50">Gestión de Flota</small>
          </button>
          <button class="btn btn-outline-info text-start" (click)="seleccionarRol('COORDINADOR')">
            <strong>Coordinador</strong><br><small class="text-white-50">Gestión Operativa</small>
          </button>
          <button class="btn btn-outline-warning text-start" (click)="seleccionarRol('SUPERVISOR')">
            <strong>Supervisor</strong><br><small class="text-white-50">Auditoría Física y Comparación</small>
          </button>
          <button class="btn btn-outline-success text-start" (click)="seleccionarRol('EMPLEADO')">
            <strong>Empleado</strong><br><small class="text-white-50">Flota e Inspecciones</small>
          </button>
        </div>
      </div>

      <!-- PASO 2: INGRESO DE CREDENCIALES -->
      <div class="text-start mb-4" *ngIf="rolSeleccionado">
        <div class="d-flex justify-content-between align-items-center border-bottom border-custom pb-2 mb-3">
          <h6 class="text-white mb-0">
            <i class="bi bi-lock"></i> Credenciales: {{ rolSeleccionado }}
          </h6>
          <button class="btn btn-sm btn-link text-custom-muted p-0" (click)="volver()">Cambiar</button>
        </div>
        
        <div class="mb-3">
          <label class="form-label text-custom-muted small">Usuario Corporativo</label>
          <input type="text" class="form-control bg-dark text-white border-custom" [(ngModel)]="usuario" placeholder="correo@empresa.com">
        </div>
        
        <div class="mb-4">
          <label class="form-label text-custom-muted small">Contraseña</label>
          <div class="input-group">
            <input [type]="mostrarClave ? 'text' : 'password'" class="form-control bg-dark text-white border-custom" [(ngModel)]="clave" placeholder="******">
            <button class="btn btn-outline-secondary border-custom bg-dark text-custom-muted" type="button" (click)="toggleClave()">
              <i class="bi" [ngClass]="mostrarClave ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-primary w-100 fw-bold" (click)="ingresar()">
          Iniciar Sesión <i class="bi bi-box-arrow-in-right"></i>
        </button>
      </div>
      
      <div class="mt-4 pt-3 border-top border-custom text-custom-muted small">
        <i class="bi bi-shield-lock"></i> Entorno de Demostración Segura
      </div>
    </div>
  </div>
</div>
