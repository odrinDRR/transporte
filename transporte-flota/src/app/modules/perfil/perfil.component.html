<div class="card bg-custom-card border-custom p-4 mb-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="text-white mb-0"><i class="bi bi-person-circle me-2"></i>Mi Perfil y Documentos</h5>
  </div>

  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="!cargando && usuarioData" class="row g-4">
    
    <!-- Columna Izquierda: Datos Personales -->
    <div class="col-md-5 border-end border-custom pe-md-4" [ngClass]="{'col-md-12 border-end-0 pe-md-0': !isEmpleadoOConductor}">
      <h6 class="text-white fw-bold mb-3 border-bottom border-custom pb-2">Datos Personales</h6>
      
      <div class="mb-3">
        <label class="text-secondary fs-xs fw-semibold mb-1">Nombre</label>
        <input type="text" class="form-control bg-dark text-white border-custom" [(ngModel)]="usuarioData.nombre">
      </div>

      <div class="mb-3">
        <label class="text-secondary fs-xs fw-semibold mb-1">Apellido</label>
        <input type="text" class="form-control bg-dark text-white border-custom" [(ngModel)]="usuarioData.apellido">
      </div>

      <div class="mb-3">
        <label class="text-secondary fs-xs fw-semibold mb-1">Correo Institucional</label>
        <input type="email" class="form-control bg-dark text-white border-custom" [(ngModel)]="usuarioData.correo">
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label class="text-secondary fs-xs fw-semibold mb-1">Cédula</label>
          <input type="text" class="form-control bg-dark text-white border-custom" [value]="usuarioData.cedula" disabled>
        </div>
        <div class="col-6 mb-3">
          <label class="text-secondary fs-xs fw-semibold mb-1">Rol Operativo</label>
          <input type="text" class="form-control bg-dark text-white border-custom fw-bold text-primary" [value]="usuarioData.cargo" disabled>
        </div>
      </div>
    </div>

    <!-- Columna Derecha: Documentos -->
    <div class="col-md-7 ps-md-4" *ngIf="isEmpleadoOConductor">
      <h6 class="text-white fw-bold mb-3 border-bottom border-custom pb-2">Gestión Documental</h6>

      <div class="mb-4">
        <label class="text-secondary fs-xs fw-semibold mb-2">Licencia de Conducir (PDF o Foto)</label>
        
        <div *ngIf="usuarioData.urlLicencia" class="mb-2">
          <a [href]="usuarioData.urlLicencia" target="_blank" class="btn btn-sm btn-outline-success">
            <i class="bi bi-eye"></i> Ver Documento Actual
          </a>
        </div>

        <div class="file-upload-box p-3 rounded-3 text-center border-dashed position-relative" [class.has-file]="archivoLicenciaNombre">
          <input type="file" class="file-input-hidden" (change)="onFileSelected($event, 'licencia')" accept=".pdf,image/*">
          <i class="bi" [ngClass]="archivoLicenciaNombre ? 'bi-file-earmark-check-fill text-success fs-4' : 'bi-cloud-arrow-up-fill text-primary fs-4'"></i>
          <span class="d-block text-white fs-xs mt-1 text-truncate px-2">
            {{ archivoLicenciaNombre || 'Haz clic para seleccionar y REEMPLAZAR tu PDF o Foto' }}
          </span>
        </div>
      </div>

      <div class="mb-4">
        <label class="text-secondary fs-xs fw-semibold mb-2">Certificado Médico (PDF o Foto)</label>
        
        <div *ngIf="usuarioData.urlCertificadoMedico" class="mb-2">
          <a [href]="usuarioData.urlCertificadoMedico" target="_blank" class="btn btn-sm btn-outline-success">
            <i class="bi bi-eye"></i> Ver Documento Actual
          </a>
        </div>

        <div class="file-upload-box p-3 rounded-3 text-center border-dashed position-relative" [class.has-file]="archivoMedicoNombre">
          <input type="file" class="file-input-hidden" (change)="onFileSelected($event, 'medico')" accept=".pdf,image/*">
          <i class="bi" [ngClass]="archivoMedicoNombre ? 'bi-file-earmark-check-fill text-success fs-4' : 'bi-cloud-arrow-up-fill text-primary fs-4'"></i>
          <span class="d-block text-white fs-xs mt-1 text-truncate px-2">
            {{ archivoMedicoNombre || 'Haz clic para seleccionar y REEMPLAZAR tu PDF o Foto' }}
          </span>
        </div>
      </div>

    </div>

  </div>

  <div class="d-flex justify-content-end mt-4 pt-3 border-top border-custom" *ngIf="!cargando && usuarioData">
    <button class="btn btn-primary fw-bold px-4" (click)="guardarCambios()" [disabled]="guardando">
      <span *ngIf="guardando" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      <i *ngIf="!guardando" class="bi bi-save me-2"></i>
      {{ guardando ? 'Guardando...' : 'Guardar Cambios' }}
    </button>
  </div>

</div>
