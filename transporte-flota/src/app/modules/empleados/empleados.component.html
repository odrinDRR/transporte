<div class="card bg-custom-card border-custom p-3">
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-custom pb-3">
    <h5 class="text-white mb-0"><i class="bi bi-people"></i> Directorio de Empleados</h5>
    <button class="btn btn-sm btn-primary">
      <i class="bi bi-person-plus"></i> Registrar Empleado
    </button>
  </div>

  <div class="mb-4" style="max-width: 400px;">
    <label class="form-label text-custom-muted small">Buscador Inteligente</label>
    <div class="input-group">
      <span class="input-group-text bg-dark text-custom-muted border-custom"><i class="bi bi-search"></i></span>
      <input type="text" class="form-control bg-dark text-white border-custom" 
             placeholder="Buscar por cédula o nombre...">
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-dark table-hover border-custom align-middle">
      <thead>
        <tr class="text-custom-muted">
          <th>Nombre y Apellido</th>
          <th>Cédula</th>
          <th>Cargo</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="5" class="text-center text-custom-muted py-4">Cargando empleados...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
