<div class="card bg-custom-card border-custom p-3">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="text-white mb-0">Control de Pólizas RCV y Documentación</h5>
  </div>

  <div class="table-responsive">
    <table class="table table-dark table-hover border-custom align-middle">
      <thead>
        <tr class="text-custom-muted">
          <th>Placa</th>
          <th>Vehículo</th>
          <th>VIN / Carrocería</th>
          <th>Póliza Seguro RCV</th>
          <th *ngIf="flotaService.puedeEditarOEliminar()">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let v of vehiculos$ | async">
          <td class="fw-bold text-white">{{ v.placa }}</td>
          <td>{{ v.identificador }}</td>
          <td class="text-custom-muted">{{ v.vin }}</td>
          <td>
            <span *ngIf="v.seguroRcvVigente" class="badge bg-success bg-opacity-25 text-success border border-success">
              <i class="bi bi-shield-check"></i> Vigente
            </span>
            <span *ngIf="!v.seguroRcvVigente" class="badge bg-danger bg-opacity-25 text-danger border border-danger">
              <i class="bi bi-shield-exclamation"></i> Vencido / Sin Póliza
            </span>
          </td>
          <td *ngIf="flotaService.puedeEditarOEliminar()">
            <button class="btn btn-sm btn-outline-primary">Actualizar PDF</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
